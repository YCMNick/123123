<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>差一度</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Bangers&family=Caveat:wght@600&family=Huninn&family=DotGothic16&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
<style>
/* Look: a sunny cartoon world (painted sky, grass hills, wooden boards, chunky 3-D buttons). The game stacks HUD, a 3:4 stage and a tool rail to phone height. */
:root{
  --sky1:#4fb8ee; --sky2:#bfeaff; --grass:#6cc84a; --grass-dark:#3f9a1f;
  --wood:#8a5a2b; --wood-dark:#5a3812; --cream:#fff6dc; --cream-2:#f3e4bd; --paper:#fffaf0; --edge:#d8c08a;
  --ink:#3b2a14; --text:#3b2a14; --muted:#8a7452; --line:#e3d2a6;
  --green:#6fcf4a; --green-dark:#3f8f21; --gold:#ffcc33; --gold-dark:#d49a00; --brass:#e0a300; --brass-ink:#3b2a14;
  --ok:#3fb950; --warn:#ff9f1a; --near:#ffd84d; --danger:#e8503a;
  --panel:#fffaf0; --panel-2:#f3e4bd;
  --f-display:"Baloo 2","Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Baloo 2","JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky2);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* chunky 3-D buttons */
.btn{--btn:var(--green);--btn-top:#9ae66e;--btn-edge:var(--green-dark);border:0;border-radius:16px;padding:12px 18px;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);background:linear-gradient(var(--btn-top),var(--btn));box-shadow:0 4px 0 var(--btn-edge),0 7px 12px rgba(40,25,5,.22);transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-edge),0 2px 4px rgba(40,25,5,.22)}
.btn.ghost{--btn:var(--cream-2);--btn-top:#fffaf0;--btn-edge:#c9a96a;color:var(--ink);text-shadow:none}
.btn.danger{--btn:#f06a55;--btn-top:#ff9a88;--btn-edge:#b33a28}
.btn:disabled{opacity:.6;filter:grayscale(.3)}

/* ---------- home ---------- */
#home{overflow:hidden}
#homeBg{position:absolute;inset:0;width:100%;height:100%;display:block}
#homeToast{top:calc(14px + env(safe-area-inset-top,0px));z-index:8;white-space:nowrap;max-width:94%}
.home-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.home-in{width:100%;max-width:560px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.06em;color:#fff;margin:0;background:linear-gradient(#a8703a,var(--wood));padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 var(--wood-dark);transform:rotate(-1.5deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.badge{font-family:var(--f-display);font-weight:800;font-size:12px;color:var(--ink);background:var(--gold);border-radius:99px;padding:3px 12px;white-space:nowrap;box-shadow:0 3px 0 var(--gold-dark);transform:rotate(2deg)}
.hero{display:grid;gap:10px}
.title{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,24vw,124px);line-height:1;margin:0;letter-spacing:.02em;color:#fff;-webkit-text-stroke:0.045em var(--wood-dark);paint-order:stroke fill;text-shadow:0 .035em 0 var(--wood-dark)}
.title.en{font-size:clamp(46px,13vw,80px);line-height:1.05}
#tilt{display:inline-block;color:var(--gold);transform-origin:50% 55%;cursor:grab;touch-action:none;transition:color .2s}
#tilt:active{cursor:grabbing}
#tilt.ok{color:#8ff26a}
.host{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:end}
#hen{width:104px;height:104px;display:block;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
#hen.happy{animation:hop .6s ease-out}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.92)}100%{transform:translateY(0)}}
.bubble{position:relative;background:#fff;border:3px solid var(--wood);border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 var(--wood-dark);margin-bottom:14px}
.bubble::before,.bubble::after{content:"";position:absolute;left:-16px;bottom:14px;border:10px solid transparent;border-right-color:var(--wood);border-left:0}
.bubble::after{left:-11px;border-right-color:#fff}
.tiltinfo{font-size:14px;color:var(--ink);margin:0;min-height:1.6em;line-height:1.5}
.tiltinfo strong{font-family:var(--f-num);font-weight:800;color:var(--danger)}
.lede{margin:0;font-size:15px;color:var(--wood-dark);font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.6);max-width:30em;text-wrap:pretty}
.startrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1 1 170px;display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--wood-dark);font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.field input{background:var(--paper);border:3px solid var(--edge);border-radius:14px;color:var(--text);padding:11px 14px;font:inherit;min-width:0;box-shadow:inset 0 2px 4px rgba(60,40,10,.12)}
#startBtn{flex:1 1 150px;padding:15px 20px;font-size:20px}
.sect{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--cream);border:4px solid var(--wood);border-radius:22px;padding:24px 14px 14px;box-shadow:0 6px 0 var(--wood-dark),0 12px 26px rgba(40,25,5,.22);margin-top:8px}
.sect h2{position:absolute;z-index:1;top:-17px;left:12px;margin:0;background:linear-gradient(#a8703a,var(--wood));color:#fff;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.04em;padding:4px 14px;border-radius:12px;box-shadow:0 3px 0 var(--wood-dark);transform:rotate(-1.5deg);max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.map-sect{padding:24px 0 0}
.map{position:relative;width:100%;border-radius:0 0 18px 18px;overflow:hidden}
#mapBg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-nodes{position:absolute;inset:0}
.lv{position:absolute;transform:translate(-50%,-50%);width:80px;height:80px;padding:0;background:none;border:0;text-align:center}
.lv .medal{width:80px;height:80px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 3px var(--wood),0 5px 0 3px var(--wood-dark),0 10px 20px rgba(40,25,5,.35);background:var(--cream-2);display:grid;place-items:center;transition:transform .1s}
.lv:hover .medal{transform:scale(1.04)}
.lv:active .medal{transform:translateY(3px)}
.lv.cleared .medal{box-shadow:0 0 0 3px var(--gold),0 5px 0 3px var(--gold-dark),0 10px 20px rgba(40,25,5,.35)}
.lv canvas{width:84px;height:112px;display:block}
.lv .sign{position:absolute;top:calc(100% - 4px);width:max-content;max-width:160px;text-align:center;background:linear-gradient(#a8703a,var(--wood));color:#fff;border-radius:12px;padding:4px 12px 6px;box-shadow:0 3px 0 var(--wood-dark);display:grid;gap:0}
.lv .k{font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.06em;color:#ffe9a8}
.lv .n{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.2;color:#fff;text-shadow:0 1px 0 var(--wood-dark)}
.lv .prog{font-family:var(--f-num);font-weight:700;font-size:11px;color:#fff3cf;margin-top:2px}
.st{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid var(--wood);background:radial-gradient(circle at 40% 35%,#fffdf5,#e9d7ad);box-shadow:0 3px 0 var(--wood-dark),0 4px 8px rgba(40,25,5,.3);padding:0;font-family:var(--f-num);font-weight:800;font-size:12px;color:var(--wood-dark);display:grid;place-items:center;line-height:1}
.st.next{width:38px;height:38px;font-size:14px;background:radial-gradient(circle at 40% 35%,#fff,#ffe9a8);animation:pulse 1.4s ease-in-out infinite}
.st.locked{opacity:.55;filter:grayscale(1)}
.st.off{background:radial-gradient(circle at 40% 35%,#e6dcc4,#cbbd98);color:#a08f68;border-color:#9c7d4e;box-shadow:0 3px 0 #7a5d33}
.stages li.off{opacity:.55}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--wood-dark),0 0 0 0 rgba(255,204,51,.7)}50%{box-shadow:0 3px 0 var(--wood-dark),0 0 0 12px rgba(255,204,51,0)}}
.here{position:absolute;width:52px;height:52px;transform:translate(-50%,-100%);margin-top:-6px;pointer-events:none;animation:bob 1.2s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 3px 2px rgba(40,25,5,.35))}
.mapmark{position:absolute;transform:translate(-50%,-50%);background:linear-gradient(#fffaf0,var(--cream-2));color:var(--wood-dark);font-family:var(--f-display);font-weight:800;font-size:12px;padding:4px 12px;border-radius:12px;box-shadow:0 0 0 3px var(--wood),0 3px 0 3px var(--wood-dark);white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:reduce){.st.next,.here{animation:none}}
.s{color:#d9c99a} .s.on{color:var(--gold-dark)}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--ink)}
.rules li{display:grid;grid-template-columns:5.6em 1fr;gap:10px}
.rules b{font-family:var(--f-display);color:var(--green-dark);font-weight:800}
.foot{font-size:12px;color:var(--muted);margin:0}
.home-in>.foot{color:var(--wood-dark);text-shadow:0 1px 0 rgba(255,255,255,.6)}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.opt>span{font-size:14px;font-weight:700}
.seg{display:inline-flex;border:0;border-radius:999px;padding:3px;gap:3px;background:#e4d3a4;box-shadow:inset 0 2px 4px rgba(60,40,10,.22)}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-family:var(--f-display);font-weight:800;font-size:14px}
.seg button[aria-checked="true"]{background:linear-gradient(#9ae66e,var(--green));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 2px 0 var(--green-dark)}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.diffs{grid-template-columns:1fr}}
.diff{position:relative;text-align:left;background:var(--paper);border:3px solid var(--edge);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:0 4px 0 #c9a96a}
.diff:hover{border-color:var(--gold-dark)}
.diff[aria-checked="true"]{border-color:var(--green-dark);background:#f1ffe6;box-shadow:0 4px 0 var(--green-dark)}
.diff[aria-checked="true"]::after{content:"✓";position:absolute;right:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 2px 0 var(--green-dark)}
.diff i{font-style:normal;font-family:var(--f-display);font-weight:800;font-size:11px;letter-spacing:.06em;color:var(--green-dark)}
.diff b{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.3;color:var(--wood-dark)}
.diff span{font-size:12px;color:var(--muted);line-height:1.5}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:46vh;overflow-y:auto}
.stages li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:10px;font-size:14px}
.stages li.play{cursor:pointer}
.stages li.play:hover{background:var(--cream-2)}
.stages li b{font-family:var(--f-num);color:var(--green-dark);font-weight:800}
.stages li.done b{color:var(--ok)}
.stages li span{font-size:12px;color:var(--muted);text-align:right}
.stages li.next{background:#f1ffe6;border:2px solid var(--green)}
.stages li .s{font-size:11px;color:#d9c99a}
.stages li .s.on{color:var(--gold-dark)}
.stages li.locked{opacity:.55}
.stages li.locked b::after{content:" 🔒"}
#ovChapter{z-index:20}
#ovLock{z-index:22}
.diff .rec{display:inline-block;margin-left:8px;font-size:11px;color:#fff;background:var(--green);border-radius:999px;padding:1px 8px;font-weight:800;vertical-align:middle;box-shadow:0 2px 0 var(--green-dark)}
/* the difficulty picker on a stage card: one row per difficulty with that stage's record */
.card .diffs{grid-template-columns:1fr;gap:8px;margin-top:2px}
.card .diff{flex-direction:row;align-items:center;gap:10px;padding:8px 12px}
.card .diff .dl{display:grid;gap:0;min-width:0;flex:1}
.card .diff b{font-size:16px}
.card .diff i{font-size:10px}
.card .diff .rec{margin-left:6px}
.card .diff .best{font-family:var(--f-num);font-weight:800;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.card .diff .best .s{font-size:12px}
.card .diff .best.got{color:var(--wood-dark)}
.card .diff[aria-checked="true"]::after{display:none}
.card .diff[aria-checked="true"]{box-shadow:0 4px 0 var(--green-dark),0 0 0 3px var(--gold)}
/* which difficulties a stage has been cleared on: three pips */
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;background:#d9c99a;border:1.5px solid #fff;box-shadow:0 0 0 1px #c9a96a}
.pips i.on{background:var(--green)} .pips i.on.n{background:#3f9fe8} .pips i.on.h{background:var(--gold)}
.st.e{background:radial-gradient(circle at 40% 35%,#b4f08f,var(--green));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.st.n{background:radial-gradient(circle at 40% 35%,#9fd4ff,#3f9fe8);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.st.h{background:radial-gradient(circle at 40% 35%,#fff0a8,var(--gold));color:var(--wood-dark)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink);align-items:center;padding:8px 14px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lread .fine{display:block;font-style:normal;font-size:10px;color:var(--gold);font-family:var(--f-num);margin-top:1px}

/* ---------- game ---------- */
#game{background:linear-gradient(var(--sky1),var(--sky2) 55%,#e6f8ff);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding-block:8px 6px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:linear-gradient(#fffaf0,var(--cream-2));color:var(--ink);display:grid;place-items:center;font-size:16px;font-weight:800;padding:0;box-shadow:0 3px 0 #c9a96a}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a96a}
.iconbtn.off{color:var(--muted);text-decoration:line-through}
.lvtag{min-width:0}
.lvtag .k{font-family:var(--f-display);font-weight:800;font-size:11px;color:var(--wood-dark);letter-spacing:.04em}
.lvtag .n{font-family:var(--f-display);font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 0 var(--wood-dark),0 2px 0 var(--wood-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--f-num);font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right;line-height:1;color:#fff;-webkit-text-stroke:1.5px var(--wood-dark);paint-order:stroke fill;text-shadow:0 2px 0 var(--wood-dark)}
.tbar{height:6px;background:rgba(255,255,255,.55);border-radius:3px;overflow:hidden;max-width:560px;width:100%;margin:0 auto 8px;flex:none;box-shadow:inset 0 1px 2px rgba(40,25,5,.25)}
.tbar i{display:block;height:100%;background:var(--green);transform-origin:left}
.stage-wrap{flex:1;min-height:0;display:grid;place-items:center}
.stage{position:relative}
#cv{display:block;width:100%;height:100%;border-radius:10px;touch-action:none;box-shadow:0 0 0 5px #fff6dc,0 0 0 8px var(--wood),0 16px 34px rgba(40,25,5,.35)}
.tools{max-width:560px;width:100%;margin:0 auto;padding-block:10px 12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.selrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--wood-dark);min-height:20px}
.selrow strong{color:var(--ink)}
.btnrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);gap:6px}
.nudge{background:linear-gradient(#fffaf0,var(--cream-2));border:0;border-radius:14px;padding:12px 0;font-family:var(--f-num);font-weight:800;font-size:14px;color:var(--ink);touch-action:manipulation;white-space:nowrap;box-shadow:0 3px 0 #c9a96a}
.nudge:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a96a}
.done{background:linear-gradient(#f0e6c8,#d9c99a);color:var(--muted);border:0;border-radius:14px;font-family:var(--f-display);font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 3px 0 #b39a62}
.done.ready{background:linear-gradient(#9ae66e,var(--green));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 3px 0 var(--green-dark);animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 3px 0 var(--green-dark),0 0 0 6px rgba(111,207,74,.35)}}
@media (pointer:coarse){.kbd{display:none}}

/* loupe (kept dark so it reads on top of any scene) */
.loupe{position:absolute;left:0;top:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-66px) scale(.55);opacity:0;transition:opacity .12s,transform .18s cubic-bezier(.3,1.5,.5,1);--lc:var(--danger)}
.loupe.on{opacity:1;transform:translate(-50%,-66px) scale(1)}
.loupe canvas{width:132px;height:132px;border-radius:50%;display:block;background:#0b0d14;box-shadow:0 0 0 3px var(--lc),0 0 0 7px #fff,0 10px 30px rgba(0,0,0,.45)}
.lread{background:rgba(12,14,22,.94);border:1px solid var(--lc);border-radius:10px;padding:3px 10px 4px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:#eceef4}
.lread b{font-family:var(--f-num);font-size:22px;color:var(--lc);font-variant-numeric:tabular-nums}
.lread span{font-size:12px}
.lread small{font-size:11px;color:#959cb1}
.loupe[data-s="mid"]{--lc:var(--warn)}
.loupe[data-s="near"]{--lc:var(--near)}
.loupe[data-s="ok"]{--lc:#43d08f}
.loupe[data-s="perfect"]{--lc:#ffd166}
.loupe[data-s="zoom"]{--lc:var(--gold)}
.loupe[data-s="perfect"] canvas{box-shadow:0 0 0 3px var(--lc),0 0 26px 6px rgba(255,209,102,.55),0 10px 30px rgba(0,0,0,.45)}

.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:rgba(40,25,5,.9);color:#fff;border:0;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:6;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* tension: last 8 seconds */
.tension{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;box-shadow:inset 0 0 90px 30px rgba(255,40,60,.55)}
#game.tense .tension{opacity:1;animation:throb 1s ease-in-out infinite}
@keyframes throb{0%,100%{opacity:.4}50%{opacity:1}}
.bignum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:min(48vw,300px);color:var(--danger);opacity:0;pointer-events:none;z-index:2}
.bignum.hit{animation:num 1s ease-out}
@keyframes num{0%{opacity:.3;transform:scale(1.25)}100%{opacity:0;transform:scale(.9)}}
#game.tense .timer{color:#ffd0c8;-webkit-text-stroke-color:#8c1d10;text-shadow:0 2px 0 #8c1d10}
#game.tense .tbar i{background:var(--danger)}
.timer.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.hud.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
/* final 3 seconds */
#game.peak .tension{animation-duration:.5s}
#game.peak .bignum{font-size:min(70vw,420px)}
.hud{position:relative}
.plus{position:absolute;right:0;top:100%;font-family:var(--f-num);font-weight:800;font-size:20px;color:var(--gold);-webkit-text-stroke:1px var(--wood-dark);paint-order:stroke fill;opacity:0;pointer-events:none;z-index:4}
.plus.pop{animation:plus 1.1s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:min(36vw,200px);color:var(--gold);-webkit-text-stroke:.06em var(--wood-dark);paint-order:stroke fill;opacity:0;pointer-events:none;z-index:4;text-shadow:0 .06em 0 var(--wood-dark),0 10px 30px rgba(0,0,0,.35)}
.count.go{font-family:var(--f-display);font-size:min(22vw,120px);color:#8ff26a}
.count.pop{animation:cnt .62s ease-out}
@keyframes cnt{0%{transform:scale(1.5);opacity:0}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}

/* overlays: wooden boards */
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(20,50,80,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.card{width:100%;max-width:420px;background:var(--cream);border:4px solid var(--wood);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 var(--wood-dark),0 26px 50px rgba(0,0,0,.35);box-sizing:border-box}
.card h2{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1.15;margin:0;text-wrap:balance;color:var(--wood-dark)}
.card p{margin:0}
.card .eyebrow{background:none;box-shadow:none;transform:none;padding:0;border-radius:0;max-width:none;white-space:normal;overflow:visible;color:var(--green-dark);text-shadow:none}
.card .place{color:var(--muted);font-size:14px;margin-top:-6px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.card .row .btn{flex:1 1 110px}
.tips{margin:0;padding-left:1.1em;color:var(--muted);font-size:14px;display:grid;gap:4px}
.hintbox{background:#fff0a8;border-left:4px solid var(--gold-dark);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--ink)}
.bigstars{font-size:36px;letter-spacing:.12em;line-height:1;text-shadow:0 2px 0 rgba(40,25,5,.2)}
.say{position:relative;background:#fff;border:3px solid var(--edge);border-radius:18px;padding:12px 14px 10px;margin-top:6px;display:grid;gap:2px}
.say::before{content:"";position:absolute;left:26px;top:-11px;width:16px;height:16px;background:#fff;border-left:3px solid var(--edge);border-top:3px solid var(--edge);transform:rotate(45deg)}
.say-h{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.3;color:#d8840a}
.say-perfect .say-h{color:var(--gold-dark)}
.say-far .say-h,.say-close .say-h{color:var(--danger)}
.say-b{font-size:15px;line-height:1.6;text-wrap:pretty}
.say-by{font-size:12px;color:var(--muted);text-align:right}
.errs{list-style:none;margin:0;padding:0;display:grid;font-size:14px}
.errs li{display:grid;grid-template-columns:minmax(0,1fr) auto 4.5em;gap:10px;align-items:baseline;padding:5px 0;border-bottom:2px dashed var(--edge)}
.errs .v{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.tag{font-size:12px;text-align:center;border-radius:99px;border:2px solid currentColor;padding:0 6px;font-weight:700}
.tag.perfect{color:var(--gold-dark)} .tag.ok{color:var(--ok)} .tag.miss{color:var(--danger)}
.tally{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;margin:0;font-size:14px}
.tally span{color:var(--muted)}
.tally em{font-style:normal;color:var(--muted);font-family:var(--f-num);font-size:12px;text-align:right}
.tally b{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--edge);padding-top:10px}
.total b{font-family:var(--f-num);font-weight:800;font-size:42px;color:var(--green-dark);font-variant-numeric:tabular-nums;line-height:1}
.best{font-size:13px;color:var(--muted)}
.best .new{color:var(--gold-dark);font-weight:800}

@media (prefers-reduced-motion:reduce){
  #game.tense .tension{animation:none;opacity:.8}
  .bignum.hit,.timer.bump,.hud.shake,.done.ready,#hen,.st.next,.here{animation:none}
  .loupe{transition:opacity .1s}
}
</style>

</head>

<div id="app">

    </div>

  <!-- GAME -->

    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <canvas id="cv" data-i18n-aria="canvas"></canvas>
        <div class="loupe" id="loupe" data-s="far" aria-hidden="true">

      <div class="btnrow">

    <div class="bignum" id="bignum" aria-hidden="true"></div>
    <div class="overlay" id="ovIntro" hidden></div>
    <div class="overlay" id="ovPause" hidden>
      <div class="card">
        <p class="eyebrow" data-i18n="paused"></p>
        <h2 data-i18n="breathe"></h2>
        <p class="place" data-i18n="pausedNote"></p>
        <div class="opts">
          <div class="opt"><span data-i18n="music"></span><div class="seg" id="pMusicSeg" role="radiogroup"><button type="button" data-v="1" data-i18n="on"></button><button type="button" data-v="0" data-i18n="off"></button></div></div>

      </div>
    </div>
    <div class="overlay" id="ovResult" hidden></div>
  </section>
</div>

const store = {
  data: { nick: '', best: {}, sound: true, music: true, lang: '' },
  load() {
    try {
      const d = JSON.parse(localStorage.getItem('chayidu.v3') || 'null');
      if (d) Object.assign(this.data, d);
      // A device that played v2 carries its progress over, once. v2 stored the ten first stages
      // by index; their keys are listed here in that order. Existing v3 values win, v2 fills the gaps.
      const old = this.data.migratedV2 ? null : JSON.parse(localStorage.getItem('chayidu.v2') || 'null');
      if (!old) return;
      const V2 = ['farm', 'reef', 'jp', 'desk', 'fr', 'polar', 'desert', 'it', 'neon', 'space'];
      for (const k of ['nick', 'sound', 'music', 'diff', 'lang']) if (this.data[k] === undefined || this.data[k] === '' || (k === 'nick' && !this.data.nick)) { if (old[k] !== undefined) this.data[k] = old[k]; }
      for (const [k, v] of Object.entries(old.best || {})) { const [diff, i] = k.split(':'); if (V2[+i] && !this.data.best[`${diff}:${V2[+i]}`]) this.data.best[`${diff}:${V2[+i]}`] = v; }
      this.data.migratedV2 = true;
      this.save();
    } catch (e) {}
  },
  save() { this.data.updatedAt = Date.now(); try { localStorage.setItem('chayidu.v3', JSON.stringify(this.data)); } catch (e) {} }
};

/* ---------- Q sound library: every sound in the game uses this cute recipe ----------
   A pure sine with a soft triangle overtone, gliding pitch and a little vibrato, the same
   recipe as the chosen 「Q 版小雞」. Every function takes (ac, out, t) so it also renders in
   an OfflineAudioContext (tests and the sound gallery). Object sounds take a pitch ratio. */
const QS = (() => {
  const nb = new WeakMap();
  const noise = (ac) => {
    if (!nb.has(ac)) { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); let s = 12345; for (let i = 0; i < d.length; i++) { s = (s * 16807) % 2147483647; d[i] = s / 2147483647 * 2 - 1; } nb.set(ac, b); }
    return nb.get(ac);
  };
  // One cute voice: pts = [[time, Hz], ...] relative to t.
  function q(ac, out, t, pts, dur, o = {}) {
    const vol = o.vol ?? 0.4, end = t + dur, a = o.attack ?? 0.01;
    let dest = out;
    if (o.trem) {
      const tg = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
      tg.gain.value = 1 - o.trem[1]; l.frequency.value = o.trem[0]; lg.gain.value = o.trem[1];
      l.connect(lg); lg.connect(tg.gain); tg.connect(out); l.start(t); l.stop(end); dest = tg;
    }
    [['sine', 1, 1], ['triangle', 2, o.over ?? 0.13]].forEach(([type, mul, g]) => {
      const osc = ac.createOscillator(), env = ac.createGain(), v = vol * g;
      osc.type = type;
      osc.frequency.setValueAtTime(pts[0][1] * mul, t + pts[0][0]);
      for (const [dt, f] of pts.slice(1)) osc.frequency.exponentialRampToValueAtTime(f * mul, t + dt);
      if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1] * mul; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(end); }
      env.gain.setValueAtTime(0, t); env.gain.linearRampToValueAtTime(v, t + a);
      env.gain.linearRampToValueAtTime(v * 0.8, t + Math.max(a, dur * (o.hold ?? 0.6))); env.gain.linearRampToValueAtTime(0, end);

    g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0, t + dur);

  }

  // Creatures: each one has its own little Q-style call.
  const creature = {
    chick: (ac, o, t) => { // the chosen 「Q 版小雞」: 啾、啾、啾～
      [0, 0.17, 0.34].forEach((d, k) => q(ac, o, t + d, [[0, 2900 + k * 80], [0.04, 3500 + k * 80], [0.11, 3000]], 0.11, { vol: 0.42 }));

    },
    moo: (ac, o, t) => q(ac, o, t, [[0, 330], [0.12, 440], [0.45, 360]], 0.5, { vib: [6, 10], attack: 0.06, vol: 0.45, over: 0.2 }),
    oink: (ac, o, t) => [0, 0.15].forEach((d) => { q(ac, o, t + d, [[0, 620], [0.09, 430]], 0.1, { vol: 0.4, over: 0.25 }); puff(ac, o, t + d, 0.07, 1200, 0.06); }),
    baa: (ac, o, t) => q(ac, o, t, [[0, 760], [0.06, 840], [0.4, 700]], 0.42, { trem: [16, 0.5], vol: 0.42 }),
    bubble: (ac, o, t) => [0, 1, 2].forEach((k) => q(ac, o, t + k * 0.09, [[0, 500 + k * 150], [0.05, 1500 + k * 300]], 0.06, { attack: 0.004, hold: 0.3, vol: 0.4 })),
    turtle: (ac, o, t) => { q(ac, o, t, [[0, 420], [0.25, 380]], 0.3, { vib: [5, 8], vol: 0.4 }); q(ac, o, t + 0.32, [[0, 600], [0.05, 1500]], 0.06, { attack: 0.004, vol: 0.3 }); },
    whale: (ac, o, t) => q(ac, o, t, [[0, 520], [0.25, 880], [0.6, 700], [0.8, 560]], 0.8, { vib: [5, 14], attack: 0.08, vol: 0.4 }),
    squish: (ac, o, t) => q(ac, o, t, [[0, 1100], [0.08, 600], [0.2, 1300]], 0.22, { vib: [20, 60], vol: 0.4 }),
    clack: (ac, o, t) => [[0, 1900], [0.1, 1900], [0.2, 2300]].forEach(([d, f]) => q(ac, o, t + d, [[0, f], [0.03, f * 0.9]], 0.045, { attack: 0.002, hold: 0.1, vol: 0.42 })),
    honk: (ac, o, t) => [0, 0.16].forEach((d) => q(ac, o, t + d, [[0, 880], [0.1, 700]], 0.12, { vol: 0.42, over: 0.3 })),

    carousel: (ac, o, t) => [1047, 1319, 1568, 2093].forEach((f, k) => note(ac, o, t + k * 0.11, f, 0.35)),
    radio: (ac, o, t) => { note(ac, o, t, 1500, 0.07); note(ac, o, t + 0.1, 2000, 0.07); q(ac, o, t + 0.22, [[0, 1200], [0.2, 2400]], 0.22, { vib: [14, 40], vol: 0.35 }); },
  };
  // Things: a cute sound per material, tuned by r so a level's objects form a little tune.
  const thing = {
    bell: (ac, o, t, r) => { q(ac, o, t, [[0, 1568 * r], [0.4, 1568 * r]], 0.45, { attack: 0.002, hold: 0.06, vol: 0.32, over: 0.3 }); q(ac, o, t, [[0, 3760 * r], [0.2, 3760 * r]], 0.2, { attack: 0.002, hold: 0.05, vol: 0.08 }); },
    wood: (ac, o, t, r) => q(ac, o, t, [[0, 880 * r], [0.05, 800 * r]], 0.09, { attack: 0.002, hold: 0.05, vol: 0.45, over: 0.25 }),
    pop: (ac, o, t, r) => q(ac, o, t, [[0, 500 * r], [0.05, 1300 * r]], 0.07, { attack: 0.003, hold: 0.2, vol: 0.4 }),
    boing: (ac, o, t, r) => q(ac, o, t, [[0, 300 * r], [0.08, 620 * r], [0.3, 520 * r]], 0.32, { vib: [18, 40 * r], vol: 0.38 }),
    twinkle: (ac, o, t, r) => { note(ac, o, t, 1760 * r, 0.18, 0.28); note(ac, o, t + 0.08, 2349 * r, 0.22, 0.24); },
    beep: (ac, o, t, r) => { note(ac, o, t, 1320 * r, 0.08); note(ac, o, t + 0.1, 1760 * r, 0.12); },
    jingle: (ac, o, t, r) => [0, 0.07, 0.14].forEach((d, k) => note(ac, o, t + d, (2093 + k * 260) * r, 0.16, 0.22)),
    shimmer: (ac, o, t, r) => { q(ac, o, t, [[0, 1200 * r], [0.4, 1800 * r]], 0.4, { vib: [10, 30], vol: 0.25 }); q(ac, o, t + 0.05, [[0, 2400 * r], [0.35, 3200 * r]], 0.35, { vib: [12, 40], vol: 0.1 }); },

/* ---------- audio: everything synthesized, no files ---------- */
const AU = {
  ctx: null, master: null, music: null, sfx: null, _nb: null,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = this.musicOn ? 0.5 : 0; this.music.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = this.soundOn ? 0.9 : 0; this.sfx.connect(this.master);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  musicOn: true, soundOn: true,
  setPrefs(music, sound) {
    this.musicOn = music; this.soundOn = sound;
    if (!this.ctx) return;
    this.music.gain.setTargetAtTime(music ? 0.5 : 0, this.ctx.currentTime, 0.02);
    this.sfx.gain.setTargetAtTime(sound ? 0.9 : 0, this.ctx.currentTime, 0.02);
  },
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c || this.silent) return;
    const t = o.at ?? c.currentTime, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const v = o.vol ?? 0.2, a = o.attack ?? 0.004;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx); osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, o = {}) {
    const c = this.ctx; if (!c || this.silent) return;
    const t = o.at ?? c.currentTime;
    if (!this._nb) { const b = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this._nb = b; }
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this._nb; f.type = 'highpass'; f.frequency.value = o.freq || 2000;
    g.gain.setValueAtTime(o.vol ?? 0.1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(o.dest || this.sfx); s.start(t); s.stop(t + dur + 0.03);
  },
  midi: n => 440 * Math.pow(2, (n - 69) / 12),
  // Every sound goes through the Q library. Calls and object sounds are logged even when muted, for tests.
  play(fn, ...args) { const c = this.ctx; if (!c || this.silent) return; fn(c, this.sfx, c.currentTime, ...args); },
  tick(fine) { this.play(QS.ui.tick, fine); },
  chime() { this.play(QS.ui.chime); },
  perfect() { this.play(QS.ui.perfect); },
  allSet() { this.play(QS.ui.allSet); },
  win() { this.play(QS.ui.win); },
  fail() { this.play(QS.ui.fail); },
  call(kind) { S.sfxLog.push(kind); if (S.sfxLog.length > 50) S.sfxLog.shift(); this.play(QS.creature[kind]); },
  thing(kind, note) { S.sfxLog.push('sfx:' + kind); if (S.sfxLog.length > 50) S.sfxLog.shift(); this.play(QS.thing[kind], QS.SCALE[note % QS.SCALE.length] * (note >= QS.SCALE.length ? 2 : 1)); },
  secTick(peak) { this.play(QS.ui.sec, peak); }
};

    const k = cw / W * dpr;

    renderScene(c2.getContext('2d'), k, L, objs, buildBg(L, k));
  });
}
function saveNick() { store.data.nick = $('#nick').value.trim().slice(0, 12); store.save(); }
$('#startBtn').onclick = () => { saveNick(); tryStart(nextIndex()); };

// the tilted 度 in the title: the first thing the player straightens
(() => {
  let el, a = 2.7, drag = null, done = false;
  const set = () => {
    el.style.transform = `rotate(${a}deg)`;
    const ok = Math.abs(a) <= TOL; el.classList.toggle('ok', ok);
    $('#tiltDeg').textContent = fmt(a) + '°';
  };
  const ang = e => deg(Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx));
  const down = e => { AU.init(); el.setPointerCapture(e.pointerId); const r = el.getBoundingClientRect(); drag = { cx: r.left + r.width / 2, cy: r.top + r.height * 0.55 }; drag.last = ang(e); };
  const move = e => {
    if (!drag) return; const n = ang(e), d = norm(n - drag.last); drag.last = n; a = norm(a + d); set();
    const b = Math.abs(a) >= 1 ? Math.trunc(a) : 1000 + Math.trunc(a * 10);
    if (b !== drag.b) { drag.b = b; AU.tick(Math.abs(a) < 1); }
  };
  const end = () => {
    if (!drag) return; drag = null;
    const info = $('#tiltInfo');
    if (Math.abs(a) <= TOL) { AU.chime(); info.innerHTML = U('tiltWin', fmt(a) + '°'); if (!done) henHop(); done = true; }
    else if (!done) info.innerHTML = U('tiltMore', fmt(a) + '°');
    else info.innerHTML = U('tiltAgain', fmt(a) + '°');
  };
  // The title is rebuilt when the language changes: hook the new span up again.
  window.__tiltReset = () => {
    el = $('#tilt');
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    $('#tiltInfo').innerHTML = U(Math.abs(a) <= TOL ? 'tiltWin' : done ? 'tiltAgain' : 'tiltStart', fmt(a) + '°');
    set();
  };
})();

/* ---------- boot ---------- */
store.load();
LANG = store.data.lang === 'en' ? 'en' : 'zh';
$('#nick').value = store.data.nick || '';
syncSound();
makeGrain();
S.diff = Math.max(0, DIFFS.findIndex(d => d.key === (store.data.diff || 'easy')));
applyLang();
buildCards();
// Players from before the question had already chosen (or kept) a difficulty: don't ask them.
new ResizeObserver(() => layout()).observe($('#stageWrap'));
drawHen();
new ResizeObserver(() => drawHomeBg()).observe($('#home'));
let mapW = 0; new ResizeObserver(() => { const w = $('#map').clientWidth; if (w && w !== mapW) { mapW = w; buildCards(); } }).observe($('#map'));
drawHomeBg();
window.addEventListener('resize', () => { if (!gameEl.hidden) layout(); });
const fontList = ['20px "DotGothic16"', '20px Bangers', '700 20px "Playfair Display"', 'italic 700 20px "Playfair Display"', '600 20px Caveat', '700 14px "Noto Sans TC"'];
Promise.race([Promise.all(fontList.map(f => document.fonts.load(f, f.includes('DotGothic') ? 'ラーメン祭' : f.includes('Noto') ? '與此同時在巴黎' : 'Ab'))), new Promise(r => setTimeout(r, 3000))])
  .catch(() => {})
  .then(() => { drawThumbs(); if (S.L && !gameEl.hidden) { S.bg = buildBg(S.L, K); S.dirty = true; } });

function tickTime(dt) {
  if (S.zen) return; // no clock in zen mode
  S.timeLeft = Math.max(0, S.timeLeft - dt);
  updateTimer();
  if (S.timeLeft <= 0) { evaluate(true); finish(S.allWas); }
}

/* ---------- test hook: driven by tests/game (automated tests + balance simulation) ---------- */
window.__chayidu = {
  api: 1,
  consts: { TOL, PERFECT, TENSE_AT, PEAK_AT, PERFECT_BONUS, TIME_PTS, MERCY_AFTER, MERCY_SECS, W, H, DIFFS: JSON.parse(JSON.stringify(DIFFS)) },
  // calibration only: adjust a difficulty's parameters
  tuneDifficulty(key, patch) { Object.assign(DIFFS.find(d => d.key === key), patch); },
  setDifficulty(key) { const k = DIFFS.findIndex(d => d.key === key); if (k < 0) throw new Error('unknown difficulty ' + key); S.diff = k; },
  setLang(l) { setLang(l); },
  setZen(on) { setZen(on); },
  // Simulate the app build (free world 1 + first stages) or the web build (everything open).
  setFreeAll(on) { FREE_ALL = !!on; buildCards(); },
  unlocked: i => unlocked(LEVELS[i]),
  available: i => available(i),
  // What the speakers are getting: context state, the gains, and whether the music loop is running.
  audioInfo: () => ({ ctx: AU.ctx ? AU.ctx.state : null, t: AU.ctx ? +AU.ctx.currentTime.toFixed(2) : null, master: AU.master ? AU.master.gain.value : null, music: AU.music ? AU.music.gain.value : null, sfx: AU.sfx ? AU.sfx.gain.value : null, musicLoop: !!MUS.timer, silent: !!AU.silent }),
  tryStart: i => tryStart(i),
  levels: () => LEVELS.map(L => ({ key: L.key, chapter: L.chapter, stage: L.stage, chapterName: tr(chapterOf(L).name), title: tr(L.title), titles: L.title,
    place: L.place, intro: L.intro, time: L.time, practice: isPractice(L), animated: !!L.animated,
    objects: L.objects.map(o => ({ id: o.id, name: tr(o.name), names: { zh: o.name.zh, en: o.name.en }, trap: !!o.trap, keep: o.keep ?? null, near: !!o.near, mag: o.mag ?? null, target: o.target ?? 0,
      call: o.call || null, sfx: o.sfx || null, habit: !!o.habit, link: o.link ? Object.assign({}, o.link) : null, x: o.x, y: o.y, w: o.w, h: o.h })) })),
  chapters: () => CHAPTERS.map(c => ({ key: c.key, name: tr(c.name), names: c.name, blurb: c.blurb, style: c.style, narrator: c.narrator, stages: c.stages.map(st => tr(st.title)) })),
  comments: () => JSON.parse(JSON.stringify(COMMENTS)),
  soundKinds: () => ({ creature: Object.keys(QS.creature), thing: Object.keys(QS.thing), ui: Object.keys(QS.ui) }),
  // Render one sound offline and report how loud and how long it is.
  async renderSound(group, kind, arg = 1) {
    const ac = new OfflineAudioContext(1, 44100 * 1.6, 44100);
    QS[group][kind](ac, ac.destination, 0.02, arg);
    const d = (await ac.startRendering()).getChannelData(0);
    let peak = 0, last = 0, bad = false;
    for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (!Number.isFinite(v)) bad = true; if (v > peak) peak = v; if (v > 0.01) last = i; }
    return { peak, seconds: last / 44100, bad };
  },
  // Picture of one level as a PNG data URL: scrambled (as a round starts) or aligned.
  scene(i, opts = {}) {
    const L = LEVELS[i], k = opts.scale || 1, b = document.createElement('canvas');
    b.width = Math.round(W * k); b.height = Math.round(H * k);
    const objs = L.objects.map((d, j) => Object.assign({}, d, { live: opts.aligned ? 0 : 1, phase: j,
      angle: d.trap ? d.keep : (d.target || 0) + (opts.aligned ? 0 : d.near ? 1.5 : (j % 2 ? -1 : 1) * d.mag) }));
    renderScene(b.getContext('2d'), k, L, objs, buildBg(L, k), opts.t ?? 0.6);
    if (opts.boxes) {
      const c = b.getContext('2d'); c.setTransform(k, 0, 0, k, 0, 0); c.lineWidth = 1;
      for (const o of objs) { c.strokeStyle = o.trap ? '#f0f' : '#0ff'; c.strokeRect(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h); txt(c, o.id, o.x, o.y - o.h / 2 + 6, '700 9px sans-serif', o.trap ? '#f0f' : '#0ff'); }
    }
    return b.toDataURL('image/png');
  },
  localText: () => [...LOCAL_TEXT],
  // Milliseconds per frame to redraw level i (background cached), averaged over n frames.
  benchScene(i, n = 60) {
    const L = LEVELS[i], k = 2, b = document.createElement('canvas'); b.width = W * k; b.height = H * k;
    const bg = buildBg(L, k), c = b.getContext('2d');
    const objs = L.objects.map((d, j) => Object.assign({}, d, { live: 1, phase: j, angle: d.trap ? d.keep : (d.mag || 1.5) }));
    const t0 = performance.now(); for (let f = 0; f < n; f++) renderScene(c, k, L, objs, bg, f / 60);
    c.getImageData(0, 0, 1, 1);
    return (performance.now() - t0) / n;
  },
  gradeTier: (r) => gradeTier(r),
  // calibration only: try a different time budget for a level
  setLevelTime(i, sec) { LEVELS[i].time = sec; },
  sfxLog: () => S.sfxLog.slice(),
  seed(n) { S.rng = n == null ? Math.random : mulberry(n); },
  // quiet: no sound and no effect animations, for fast headless simulation
  quiet(on) { AU.silent = !!on; S.noFx = !!on; if (on) MUS.stop(); },
  manualClock(on) { S.manualClock = !!on; S.lastT = null; },
  start(i, opts = {}) { startLevel(i, true, opts.instant !== false); return this.state(); },
  advance(sec) { let left = sec; while (left > 1e-9 && S.running && !S.paused) { const dt = Math.min(0.05, left); tickTime(dt); left -= dt; } return S.timeLeft; },
  rotate(id, d) { const o = S.objs.find(x => x.id === id); if (!o || !S.running || S.paused) return false; rotateObj(o, d); return true; },
  setAngle(id, a) { const o = S.objs.find(x => x.id === id); return o ? this.rotate(id, norm(a - o.angle)) : false; },
  release() { if (S.running) evaluate(); },
  select(id) { select(S.objs.find(x => x.id === id) || null); },
  nudge: d => nudge(d),
  done() { doneBtn.click(); },
  pause: () => pause(),
  resume: () => resume(),
  home: () => goHome(),
  resetProgress() { store.data.best = {}; store.save(); S.session = {}; S.fails = {}; },
  computeScore: (objs, timeLeft, win, diffKey, zen = false) => computeScore(objs.map(o => Object.assign({ target: 0 }, o)), timeLeft, win, diffKey ? DIFFS.find(d => d.key === diffKey) : DF(), zen),
  // Feed a drag through the real input path with a chosen clock, so tests can check the fine-control gain.
  dragSteps(id, pts, msPerStep = 16) {
    const o = S.objs.find(x => x.id === id); if (!o || !S.running) return false;
    const t0 = performance.now(); select(o); S.drag = { o, id: -1, last: null };
    pts.forEach((p, k) => dragMove({ x: p[0], y: p[1] }, t0 + k * msPerStep));
    S.drag = null; evaluate(); return true;
  },
  state() {
    const [n, m] = counts();
    return { screen: gameEl.hidden ? 'home' : 'game', level: S.levelIdx, key: S.L && S.L.key, diff: DF().key, tol: DF().tol,
      running: S.running, paused: S.paused, ended: S.ended, timeLeft: S.timeLeft, timeTotal: S.timeTotal,
      tense: S.tense, peak: gameEl.classList.contains('peak'), aligned: n, required: m,
      doneEnabled: !doneBtn.disabled, timerText: timerEl.textContent,
      objs: S.objs.map(o => ({ id: o.id, angle: o.angle, target: o.target, err: errOf(o), keep: o.keep ?? null, trap: !!o.trap, call: o.call || null, live: o.live,
        aligned: !!o.wasAligned, perfect: !!o.wasPerfect, bonusGiven: !!o.bonusGiven })),
      fails: Object.assign({}, S.fails), session: Object.assign({}, S.session), lastResult: S.lastResult,
      lang: LANG, zen: !!S.zen, stalled: stalled(), toast: ($(gameEl.hidden ? '#homeToast' : '#toast').classList.contains('on') ? $(gameEl.hidden ? '#homeToast' : '#toast').textContent : ''), audio: { music: AU.musicOn, sound: AU.soundOn }, overlays: { lock: !$('#ovLock').hidden, intro: !$('#ovIntro').hidden, pause: !$('#ovPause').hidden, result: !$('#ovResult').hidden, chapter: !$('#ovChapter').hidden } };
  }
};

function loop(t) {
  const dt = S.lastT == null ? 0 : Math.min(0.1, (t - S.lastT) / 1000); S.lastT = t;
  if (S.running && !S.paused && !S.manualClock) tickTime(dt);
  if (S.L && (S.L.animated || stalled()) && !gameEl.hidden && !document.hidden) S.dirty = true;
  if (S.dirty) { S.dirty = false; render(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
