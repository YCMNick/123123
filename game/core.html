<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>差一度</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600&family=DotGothic16&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
<style>
/* Layout: one-screen app. Home is a left-aligned instrument panel on graph paper; the game stacks HUD, a 3:4 stage and a tool rail to phone height. Deliberately single dark theme. */
:root{
  --ink:#10131c; --panel:#181c29; --panel-2:#21263a; --line:#2d3349; --grid:#161a26;
  --text:#eceef4; --muted:#959cb1; --brass:#e3b04b; --brass-ink:#241904;
  --ok:#43d08f; --gold:#ffd166; --warn:#ffb03a; --near:#ffe066; --danger:#ff4a5c;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{position:relative;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- home ---------- */
#home{overflow-y:auto;background:
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--ink)}
.home-in{width:100%;max-width:560px;margin:0 auto;padding-block:18px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;box-sizing:border-box}
.ruler{position:relative;height:28px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 50px) left bottom/100% 14px no-repeat,
             repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px) left bottom/100% 7px no-repeat}
.ruler b{position:absolute;left:50%;top:0;transform:translateX(-50%);font-family:var(--f-num);font-size:11px;color:var(--brass);font-weight:700}
.ruler b::after{content:"";position:absolute;left:50%;top:16px;width:2px;height:12px;background:var(--brass);transform:translateX(-50%)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:0}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.title{font-family:var(--f-display);font-weight:900;font-size:clamp(72px,24vw,124px);line-height:1;margin:0;letter-spacing:.03em}
#tilt{display:inline-block;color:var(--brass);transform-origin:50% 55%;cursor:grab;touch-action:none;transition:color .2s}
#tilt:active{cursor:grabbing}
#tilt.ok{color:var(--ok)}
.tiltinfo{font-family:var(--f-num);font-size:13px;color:var(--muted);margin:-8px 0 0;min-height:1.6em}
.tiltinfo strong{color:var(--text)}
.lede{margin:0;font-size:16px;max-width:30em;text-wrap:pretty}
.startrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1 1 170px;display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;font:inherit;min-width:0}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:16px;line-height:1.2}
.btn.primary{background:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--muted)}
#startBtn{flex:1 1 150px;padding:14px 20px;font-size:17px}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h2{font-size:13px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.08em}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.lv:hover{border-color:var(--brass)}
.lv canvas{width:84px;height:112px;border-radius:6px;display:block;background:var(--panel-2)}
.lv .k{font-family:var(--f-num);font-size:11px;letter-spacing:.1em;color:var(--brass)}
.lv .n{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.3}
.lv .m{color:var(--muted);font-size:13px}
.lv .best{font-family:var(--f-num);font-size:12px;margin-top:4px}
.s{color:var(--line)} .s.on{color:var(--gold)}
.rules{display:grid;gap:8px;margin:0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.rules li{display:grid;grid-template-columns:5.6em 1fr;gap:10px}
.rules b{font-family:var(--f-num);color:var(--brass);font-weight:700}
.foot{font-size:12px;color:var(--muted);margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.opt>span{font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.seg button[aria-checked="true"]{background:var(--brass);color:var(--brass-ink)}
.title.en{font-size:clamp(44px,13vw,76px);line-height:1.05}
.lv .prog{font-family:var(--f-num);font-size:12px;margin-top:4px}
.stages li.play{cursor:pointer}
.stages li.play:hover{background:var(--panel-2)}
.stages li.done b{color:var(--ok)}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-height:46vh;overflow-y:auto}
.stages li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:14px}
.stages li b{font-family:var(--f-num);color:var(--brass);font-weight:700}
.stages li span{font-size:12px;color:var(--muted);text-align:right}
.stages li.next{background:var(--panel-2);border:1px solid var(--brass)}
.stages li .s{font-size:11px;color:var(--line)}
.stages li .s.on{color:var(--brass)}
#ovChapter{z-index:20}

/* ---------- game ---------- */
#game{background:var(--ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding-block:8px 6px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:15px;padding:0}
.iconbtn.off{color:var(--muted);text-decoration:line-through}
.lvtag{min-width:0}
.lvtag .k{font-family:var(--f-num);font-size:11px;color:var(--brass);letter-spacing:.08em}
.lvtag .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-family:var(--f-num);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:right;line-height:1}
.tbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;max-width:560px;width:100%;margin:0 auto 8px;flex:none}
.tbar i{display:block;height:100%;background:var(--brass);transform-origin:left}
.stage-wrap{flex:1;min-height:0;display:grid;place-items:center}
.stage{position:relative}
#cv{display:block;width:100%;height:100%;border-radius:8px;touch-action:none;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.45)}
.tools{max-width:560px;width:100%;margin:0 auto;padding-block:8px 12px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.selrow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);min-height:20px}
.selrow strong{color:var(--text)}
.btnrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.5fr);gap:6px}
.nudge{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 0;font-family:var(--f-num);font-size:13px;touch-action:manipulation;white-space:nowrap}
.nudge:active{background:var(--panel-2);border-color:var(--brass)}
.done{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:15px;white-space:nowrap}
.done.ready{background:var(--ok);color:#06210f;border-color:transparent;animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(67,208,143,.25)}}
@media (pointer:coarse){.kbd{display:none}}

/* loupe */
.loupe{position:absolute;left:0;top:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translate(-50%,-66px) scale(.55);opacity:0;transition:opacity .12s,transform .18s cubic-bezier(.3,1.5,.5,1);--lc:var(--danger)}
.loupe.on{opacity:1;transform:translate(-50%,-66px) scale(1)}
.loupe canvas{width:132px;height:132px;border-radius:50%;display:block;background:#0b0d14;box-shadow:0 0 0 3px var(--lc),0 0 0 7px rgba(0,0,0,.55),0 10px 30px rgba(0,0,0,.55)}
.lread{background:rgba(12,14,22,.94);border:1px solid var(--lc);border-radius:10px;padding:3px 10px 4px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.lread b{font-family:var(--f-num);font-size:22px;color:var(--lc);font-variant-numeric:tabular-nums}
.lread span{font-size:12px}
.lread small{font-size:11px;color:var(--muted)}
.loupe[data-s="mid"]{--lc:var(--warn)}
.loupe[data-s="near"]{--lc:var(--near)}
.loupe[data-s="ok"]{--lc:var(--ok)}
.loupe[data-s="perfect"]{--lc:var(--gold)}
.loupe[data-s="zoom"]{--lc:var(--brass)}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.diffs{grid-template-columns:1fr}}
.diff{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.diff:hover{border-color:var(--muted)}
.diff[aria-checked="true"]{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.diff i{font-style:normal;font-family:var(--f-num);font-size:11px;letter-spacing:.08em;color:var(--brass)}
.diff b{font-family:var(--f-display);font-weight:900;font-size:18px;line-height:1.3}
.diff span{font-size:12px;color:var(--muted);line-height:1.5}
.loupe[data-s="perfect"] canvas{box-shadow:0 0 0 3px var(--lc),0 0 26px 6px rgba(255,209,102,.55),0 10px 30px rgba(0,0,0,.55)}

.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:rgba(12,14,22,.94);border:1px solid var(--line);padding:6px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;z-index:6;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* tension: last 10 seconds */
.tension{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;box-shadow:inset 0 0 90px 30px rgba(255,40,60,.62)}
#game.tense .tension{opacity:1;animation:throb 1s ease-in-out infinite}
@keyframes throb{0%,100%{opacity:.4}50%{opacity:1}}
.bignum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:min(48vw,300px);color:var(--danger);opacity:0;pointer-events:none;z-index:2}
.bignum.hit{animation:num 1s ease-out}
@keyframes num{0%{opacity:.3;transform:scale(1.25)}100%{opacity:0;transform:scale(.9)}}
#game.tense .timer{color:var(--danger)}
#game.tense .tbar i{background:var(--danger)}
.timer.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.hud.shake{animation:shake .3s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
/* final 3 seconds */
#game.peak .tension{animation-duration:.5s}
#game.peak .bignum{font-size:min(70vw,420px)}
.hud{position:relative}
.plus{position:absolute;right:0;top:100%;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--gold);opacity:0;pointer-events:none;z-index:4}
.plus.pop{animation:plus 1.1s ease-out}
@keyframes plus{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:min(36vw,200px);color:var(--brass);opacity:0;pointer-events:none;z-index:4;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.count.go{font-family:var(--f-display);font-weight:900;font-size:min(22vw,120px)}
.count.pop{animation:cnt .62s ease-out}
@keyframes cnt{0%{transform:scale(1.5);opacity:0}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}

/* overlays */
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(8,10,16,.66);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(0,0,0,.5);box-sizing:border-box}
.card h2{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
.card p{margin:0}
.card .place{color:var(--muted);font-size:14px;margin-top:-6px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.card .row .btn{flex:1 1 110px}
.tips{margin:0;padding-left:1.1em;color:var(--muted);font-size:14px;display:grid;gap:4px}
.hintbox{background:var(--panel-2);border-left:3px solid var(--brass);border-radius:8px;padding:8px 12px;font-size:14px}
.bigstars{font-size:34px;letter-spacing:.12em;line-height:1}
.say{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;margin-top:6px;display:grid;gap:2px}
.say::before{content:"";position:absolute;left:26px;top:-9px;width:16px;height:16px;background:var(--panel-2);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.say-h{font-family:var(--f-display);font-weight:900;font-size:21px;line-height:1.3;color:var(--brass)}
.say-perfect .say-h{color:var(--gold)}
.say-far .say-h,.say-close .say-h{color:var(--warn)}
.say-b{font-size:15px;line-height:1.6;text-wrap:pretty}
.say-by{font-size:12px;color:var(--muted);text-align:right}
.errs{list-style:none;margin:0;padding:0;display:grid;font-size:14px}
.errs li{display:grid;grid-template-columns:minmax(0,1fr) auto 4.5em;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.errs .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.tag{font-size:12px;text-align:center;border-radius:99px;border:1px solid currentColor;padding:0 6px}
.tag.perfect{color:var(--gold)} .tag.ok{color:var(--ok)} .tag.miss{color:var(--danger)}
.tally{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;margin:0;font-size:14px}
.tally span{color:var(--muted)}
.tally em{font-style:normal;color:var(--muted);font-family:var(--f-num);font-size:12px;text-align:right}
.tally b{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.total b{font-family:var(--f-num);font-size:40px;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1}
.best{font-size:13px;color:var(--muted)}
.best .new{color:var(--gold);font-weight:700}

@media (prefers-reduced-motion:reduce){
  #game.tense .tension{animation:none;opacity:.8}
  .bignum.hit,.timer.bump,.hud.shake,.done.ready{animation:none}
  .loupe{transition:opacity .1s}
}
</style>

</head>
<body>
<div id="app">
  <!-- HOME -->
  <section id="home" class="screen">
    <div class="home-in">
      <div class="ruler" aria-hidden="true"><b>0°</b></div>
      <div class="top">
        <p class="eyebrow" data-i18n="eyebrow">強迫對齊・地球宇宙</p>
        <span class="badge" data-i18n="badge">免註冊・打開就玩</span>
      </div>
      <h1 class="title" id="title" aria-label="差一度">差一<span id="tilt" role="img" aria-label="度（歪的，可以拖曳轉正）">度</span></h1>
      <p class="tiltinfo" id="tiltInfo">「度」歪了 <strong id="tiltDeg">2.7°</strong>，拖曳它轉轉看</p>
      <p class="lede" data-i18n="lede"></p>
      <div class="startrow">
        <div class="field">
          <label for="nick" data-i18n="nickLabel"></label>
          <input id="nick" maxlength="12" autocomplete="off">
        </div>
        <button class="btn primary" id="startBtn">開始遊戲</button>
      </div>
      <div class="sect">
        <h2 data-i18n="settings"></h2>
        <div class="opts">
          <div class="opt"><span data-i18n="lang"></span><div class="seg" id="langSeg" role="radiogroup"><button type="button" data-v="zh">中文</button><button type="button" data-v="en">English</button></div></div>
          <div class="opt"><span data-i18n="music"></span><div class="seg" id="musicSeg" role="radiogroup"><button type="button" data-v="1" data-i18n="on"></button><button type="button" data-v="0" data-i18n="off"></button></div></div>
          <div class="opt"><span data-i18n="sound"></span><div class="seg" id="soundSeg" role="radiogroup"><button type="button" data-v="1" data-i18n="on"></button><button type="button" data-v="0" data-i18n="off"></button></div></div>
        </div>
      </div>
      <div class="sect">
        <h2 data-i18n="diffTitle"></h2>
        <div class="diffs" id="diffs" role="radiogroup" aria-label="難度"></div>
      </div>
      <div class="sect">
        <h2 data-i18n="worldsTitle"></h2>
        <div class="levels" id="levels"></div>
      </div>
      <div class="sect">
        <h2 data-i18n="rulesTitle"></h2>
        <ul class="rules" id="rules"></ul>
      </div>
      <p class="foot" data-i18n="foot"></p>
    </div>
  </section>

  <div class="overlay" id="ovChapter" hidden></div>

  <!-- GAME -->
  <section id="game" class="screen" hidden>
    <header class="hud" id="hud">
      <button class="iconbtn" id="pauseBtn" data-i18n-aria="pause">Ⅱ</button>
      <div class="lvtag"><div class="k" id="lvK">LEVEL 1/3</div><div class="n" id="lvN">京都・黃昏</div></div>
      <button class="iconbtn" id="musicBtn" data-i18n-aria="musicBtn">♪</button>
      <div class="timer" id="timer" aria-live="off">30</div>
      <div class="plus" id="plus" aria-hidden="true"></div>
    </header>
    <div class="tbar"><i id="tbar"></i></div>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <canvas id="cv" data-i18n-aria="canvas"></canvas>
        <div class="loupe" id="loupe" data-s="far" aria-hidden="true">
          <canvas id="lcv"></canvas>
          <div class="lread"><small id="lname"></small><b id="ldeg">0.0°</b><span id="ldir"></span></div>
        </div>
        <div class="toast" id="toast" role="status"></div>

cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

function nudge(d) {
  if (!S.running || S.paused) return false;
  if (!S.selected) { toast(U('pickFirst')); return false; }
  rotateObj(S.selected, d); showLoupe(S.selected); return true;
}
document.querySelectorAll('.nudge').forEach(b => {
  let t1, t2;
  const d = parseFloat(b.dataset.d);
  const stop = () => { if (t1 == null && t2 == null) return; clearTimeout(t1); clearInterval(t2); t1 = t2 = null; if (S.running) { evaluate(); hideLoupeSoon(1200); } };
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!nudge(d)) return; t1 = setTimeout(() => { t2 = setInterval(() => nudge(d), 70); }, 350); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (nudge(d)) { evaluate(); hideLoupeSoon(1200); } } });
});
doneBtn.addEventListener('click', () => { if (S.running && !S.paused) { evaluate(true); if (S.allWas) finish(true); } });
window.addEventListener('keydown', e => {
  if (gameEl.hidden || !S.running || S.paused) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    const d = (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 0.1);
    if (nudge(d)) { clearTimeout(S.kt); S.kt = setTimeout(() => { evaluate(); hideLoupeSoon(1200); }, 250); }
  } else if (e.key === 'Escape') pause();
});
$('#pauseBtn').onclick = pause;
$('#resumeBtn').onclick = resume;
$('#restartBtn').onclick = () => { $('#ovPause').hidden = true; if (AU.ctx) AU.ctx.resume(); startLevel(S.levelIdx, true); };
$('#quitBtn').onclick = goHome;
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- settings: language, music, sound effects ---------- */
function syncSound() {
  const music = store.data.music !== false, sound = store.data.sound !== false;
  AU.setPrefs(music, sound);
  for (const [id, v] of [['musicSeg', music], ['pMusicSeg', music], ['soundSeg', sound], ['pSoundSeg', sound]]) markSeg($('#' + id), v ? '1' : '0');
  $('#musicBtn').classList.toggle('off', !music); $('#musicBtn').setAttribute('aria-pressed', String(music));
}
function markSeg(seg, v) { seg.querySelectorAll('button').forEach(b => { b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(b.dataset.v === v)); }); }
function setMusic(on) { AU.init(); store.data.music = on; store.save(); syncSound(); if (on && S.running && !S.paused) MUS.start(S.L.song); }
function setSound(on) { AU.init(); store.data.sound = on; store.save(); syncSound(); }
$('#musicBtn').onclick = () => setMusic(store.data.music === false);
for (const id of ['musicSeg', 'pMusicSeg']) $('#' + id).onclick = e => { const b = e.target.closest('button'); if (b) setMusic(b.dataset.v === '1'); };
for (const id of ['soundSeg', 'pSoundSeg']) $('#' + id).onclick = e => { const b = e.target.closest('button'); if (b) setSound(b.dataset.v === '1'); };
$('#langSeg').onclick = e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.v); };
// Fill every static label for the current language.
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.title = U('titleLabel');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = U(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', U(el.dataset.i18nAria)));
  document.querySelectorAll('.nudge').forEach((b, k) => b.setAttribute('aria-label', U('nudge')[k]));
  $('#nick').placeholder = U('nickPh');
  $('#rules').innerHTML = U('rules').map(([b, t]) => `<li><b>${b}</b><span>${t}</span></li>`).join('');
  const title = $('#title'); title.innerHTML = U('title'); title.setAttribute('aria-label', U('titleLabel')); title.classList.toggle('en', LANG === 'en');
  markSeg($('#langSeg'), LANG);
  select(S.selected);
  if (window.__tiltReset) window.__tiltReset();
}
function setLang(l) {
  LANG = l === 'en' ? 'en' : 'zh'; store.data.lang = LANG; store.save();
  applyLang(); buildDiffs(); buildCards();
}

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }

/* ---------- home ---------- */
const starsOf = i => (store.data.best[bestKey(i)] || {}).stars || 0;
const clearedOf = i => !!store.data.best[bestKey(i)] && starsOf(i) > 0;
// First stage not yet cleared on this difficulty (in order), else the very first.
function nextIndex(from = 0, to = LEVELS.length) { for (let i = from; i < to; i++) if (!clearedOf(i)) return i; return from; }
function buildCards() {
  const box = $('#levels'); box.innerHTML = '';
  CHAPTERS.forEach((ch, c) => {
    const idx = LEVELS.map((L, i) => i).filter(i => LEVELS[i].chapter === c), first = LEVELS[idx[0]];
    const done = idx.filter(clearedOf).length, stars = idx.reduce((a, i) => a + starsOf(i), 0);
    const btn = document.createElement('button'); btn.className = 'lv'; btn.type = 'button';
    btn.innerHTML = `<canvas width="84" height="112" aria-hidden="true"></canvas><div>
      <div class="k">${U('worldK', c + 1, tr(ch.style))}</div>
      <div class="n">${tr(ch.name)}</div>
      <div class="m">${tr(ch.blurb)}</div>
      <div class="prog">${U('worldProg', done, idx.length, stars, idx.length * 3)}</div></div>`;
    btn.onclick = () => { saveNick(); openChapter(c); };
    box.appendChild(btn);
  });
  const n = nextIndex();
  $('#startBtn').textContent = clearedOf(0) ? U('cont', stageLabel(LEVELS[n])) : U('start');
  drawThumbs();
}
function buildDiffs() {
  const box = $('#diffs'); box.innerHTML = '';
  DIFFS.forEach((d, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'diff'; b.id = `diff-${d.key}`;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(k === S.diff));
    b.innerHTML = `<i>${tr(d.level)}</i><b>${tr(d.name)}</b><span>${tr(d.note)}</span>`;
    b.onclick = () => setDiff(k);
    box.appendChild(b);
  });
}
function setDiff(k) {
  S.diff = k; store.data.diff = DIFFS[k].key; store.save();
  buildDiffs(); buildCards();
}
function openChapter(c) {
  const ch = CHAPTERS[c], idx = LEVELS.map((L, i) => i).filter(i => LEVELS[i].chapter === c);
  const nx = nextIndex(idx[0], idx[idx.length - 1] + 1), ov = $('#ovChapter');
  const rows = idx.map(i => {
    const L = LEVELS[i], b = store.data.best[bestKey(i)], n = L.objects.filter(o => !o.trap).length;
    const st = [0, 1, 2].map(j => `<span class="s ${j < starsOf(i) ? 'on' : ''}">★</span>`).join('');
    return `<li class="play${i === nx ? ' next' : ''}${clearedOf(i) ? ' done' : ''}" data-i="${i}" tabindex="0" role="button"><b>${stageLabel(L)}</b><strong>${tr(L.title)}</strong><span>${U('stageInfo', n, levelTime(L))}${b ? ' · ' + U('stageBest', b.score) : ''} ${st}</span></li>`;
  }).join('');
  ov.innerHTML = `<div class="card">
    <p class="eyebrow">${U('worldK', c + 1, tr(ch.style))}</p>
    <h2>${tr(ch.name)}</h2>
    <p class="place">${tr(ch.blurb)}</p>
    <ol class="stages">${rows}</ol>
    <div class="row"><button class="btn primary" id="sheetPlay">${U('play', stageLabel(LEVELS[nx]))}</button><button class="btn ghost" id="sheetClose">${U('back')}</button></div>
  </div>`;
  ov.hidden = false;
  const go = i => { ov.hidden = true; startLevel(i); };
  ov.querySelectorAll('.stages li').forEach(li => {
    li.onclick = () => go(+li.dataset.i);
    li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(+li.dataset.i); } };
  });
  $('#sheetPlay').onclick = () => go(nx);
  $('#sheetClose').onclick = () => { ov.hidden = true; };
  $('#sheetPlay').focus();
}
function drawThumbs() {
  document.querySelectorAll('.lv canvas').forEach((c2, c) => {
    const L = LEVELS.find(x => x.chapter === c), dpr = Math.min(window.devicePixelRatio || 1, 2), cw = 84;
    c2.width = Math.round(cw * dpr); c2.height = Math.round(cw / 0.75 * dpr);
    const k = cw / W * dpr;
    const objs = L.objects.map((d, j) => Object.assign({}, d, { angle: d.trap ? d.keep : (d.target || 0) + (d.near ? 1.5 : (j % 2 ? -1 : 1) * d.mag), live: 1, phase: j }));
    renderScene(c2.getContext('2d'), k, L, objs, buildBg(L, k));
  });
}
function saveNick() { store.data.nick = $('#nick').value.trim().slice(0, 12); store.save(); }
$('#startBtn').onclick = () => { saveNick(); startLevel(nextIndex()); };

// the tilted 度 in the title: the first thing the player straightens
(() => {
  let el, a = 2.7, drag = null, done = false;
  const set = () => {
    el.style.transform = `rotate(${a}deg)`;
    const ok = Math.abs(a) <= TOL; el.classList.toggle('ok', ok);
    $('#tiltDeg').textContent = fmt(a) + '°';
  };
  const ang = e => deg(Math.atan2(e.clientY - drag.cy, e.clientX - drag.cx));
  const down = e => { AU.init(); el.setPointerCapture(e.pointerId); const r = el.getBoundingClientRect(); drag = { cx: r.left + r.width / 2, cy: r.top + r.height * 0.55 }; drag.last = ang(e); };
  const move = e => {
    if (!drag) return; const n = ang(e), d = norm(n - drag.last); drag.last = n; a = norm(a + d); set();
    const b = Math.abs(a) >= 1 ? Math.trunc(a) : 1000 + Math.trunc(a * 10);
    if (b !== drag.b) { drag.b = b; AU.tick(Math.abs(a) < 1); }
  };
  const end = () => {
    if (!drag) return; drag = null;
    const info = $('#tiltInfo');
    if (Math.abs(a) <= TOL) { AU.chime(); info.innerHTML = U('tiltWin', fmt(a) + '°'); done = true; }
    else if (!done) info.innerHTML = U('tiltMore', fmt(a) + '°');
    else info.innerHTML = U('tiltAgain', fmt(a) + '°');
  };
  // The title is rebuilt when the language changes: hook the new span up again.
  window.__tiltReset = () => {
    el = $('#tilt');
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    $('#tiltInfo').innerHTML = U(Math.abs(a) <= TOL ? 'tiltWin' : done ? 'tiltAgain' : 'tiltStart', fmt(a) + '°');
    set();
  };
})();

/* ---------- boot ---------- */
store.load();
LANG = store.data.lang === 'en' ? 'en' : 'zh';
$('#nick').value = store.data.nick || '';
syncSound();
makeGrain();
S.diff = Math.max(0, DIFFS.findIndex(d => d.key === (store.data.diff || 'normal')));
applyLang();
buildDiffs();
buildCards();
new ResizeObserver(() => layout()).observe($('#stageWrap'));
window.addEventListener('resize', () => { if (!gameEl.hidden) layout(); });
const fontList = ['20px "DotGothic16"', '20px Bangers', '700 20px "Playfair Display"', 'italic 700 20px "Playfair Display"', '600 20px Caveat', '700 14px "Noto Sans TC"'];
Promise.race([Promise.all(fontList.map(f => document.fonts.load(f, f.includes('DotGothic') ? 'ラーメン祭' : f.includes('Noto') ? '與此同時在巴黎' : 'Ab'))), new Promise(r => setTimeout(r, 3000))])
  .catch(() => {})
  .then(() => { drawThumbs(); if (S.L && !gameEl.hidden) { S.bg = buildBg(S.L, K); S.dirty = true; } });

function tickTime(dt) {
  S.timeLeft = Math.max(0, S.timeLeft - dt);
  updateTimer();
  if (S.timeLeft <= 0) { evaluate(true); finish(S.allWas); }
}

/* ---------- test hook: driven by tests/game (automated tests + balance simulation) ---------- */
window.__chayidu = {
  api: 1,
  consts: { TOL, PERFECT, TENSE_AT, PEAK_AT, PERFECT_BONUS, TIME_PTS, MERCY_AFTER, MERCY_SECS, W, H, DIFFS: JSON.parse(JSON.stringify(DIFFS)) },
  // calibration only: adjust a difficulty's parameters
  tuneDifficulty(key, patch) { Object.assign(DIFFS.find(d => d.key === key), patch); },
  setDifficulty(key) { const k = DIFFS.findIndex(d => d.key === key); if (k < 0) throw new Error('unknown difficulty ' + key); S.diff = k; },
  setLang(l) { setLang(l); },
  levels: () => LEVELS.map(L => ({ key: L.key, chapter: L.chapter, stage: L.stage, chapterName: tr(chapterOf(L).name), title: tr(L.title), titles: L.title,
    place: L.place, intro: L.intro, time: L.time, animated: !!L.animated,
    objects: L.objects.map(o => ({ id: o.id, name: tr(o.name), names: { zh: o.name.zh, en: o.name.en }, trap: !!o.trap, keep: o.keep ?? null, near: !!o.near, mag: o.mag ?? null, target: o.target ?? 0,
      call: o.call || null, sfx: o.sfx || null, habit: !!o.habit, link: o.link ? Object.assign({}, o.link) : null, x: o.x, y: o.y, w: o.w, h: o.h })) })),
  chapters: () => CHAPTERS.map(c => ({ key: c.key, name: tr(c.name), names: c.name, blurb: c.blurb, style: c.style, narrator: c.narrator, stages: c.stages.map(st => tr(st.title)) })),
  comments: () => JSON.parse(JSON.stringify(COMMENTS)),
  soundKinds: () => ({ creature: Object.keys(QS.creature), thing: Object.keys(QS.thing), ui: Object.keys(QS.ui) }),
  // Render one sound offline and report how loud and how long it is.
  async renderSound(group, kind, arg = 1) {
    const ac = new OfflineAudioContext(1, 44100 * 1.6, 44100);
    QS[group][kind](ac, ac.destination, 0.02, arg);
    const d = (await ac.startRendering()).getChannelData(0);
    let peak = 0, last = 0, bad = false;
    for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (!Number.isFinite(v)) bad = true; if (v > peak) peak = v; if (v > 0.01) last = i; }
    return { peak, seconds: last / 44100, bad };
  },
  // Picture of one level as a PNG data URL: scrambled (as a round starts) or aligned.
  scene(i, opts = {}) {
    const L = LEVELS[i], k = opts.scale || 1, b = document.createElement('canvas');
    b.width = Math.round(W * k); b.height = Math.round(H * k);
    const objs = L.objects.map((d, j) => Object.assign({}, d, { live: opts.aligned ? 0 : 1, phase: j,
      angle: d.trap ? d.keep : (d.target || 0) + (opts.aligned ? 0 : d.near ? 1.5 : (j % 2 ? -1 : 1) * d.mag) }));
    renderScene(b.getContext('2d'), k, L, objs, buildBg(L, k), opts.t ?? 0.6);
    if (opts.boxes) {
      const c = b.getContext('2d'); c.setTransform(k, 0, 0, k, 0, 0); c.lineWidth = 1;
      for (const o of objs) { c.strokeStyle = o.trap ? '#f0f' : '#0ff'; c.strokeRect(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h); txt(c, o.id, o.x, o.y - o.h / 2 + 6, '700 9px sans-serif', o.trap ? '#f0f' : '#0ff'); }
    }
    return b.toDataURL('image/png');
  },
  localText: () => [...LOCAL_TEXT],
  // Milliseconds per frame to redraw level i (background cached), averaged over n frames.
  benchScene(i, n = 60) {
    const L = LEVELS[i], k = 2, b = document.createElement('canvas'); b.width = W * k; b.height = H * k;
    const bg = buildBg(L, k), c = b.getContext('2d');
    const objs = L.objects.map((d, j) => Object.assign({}, d, { live: 1, phase: j, angle: d.trap ? d.keep : (d.mag || 1.5) }));
    const t0 = performance.now(); for (let f = 0; f < n; f++) renderScene(c, k, L, objs, bg, f / 60);
    c.getImageData(0, 0, 1, 1);
    return (performance.now() - t0) / n;
  },
  gradeTier: (r) => gradeTier(r),
  // calibration only: try a different time budget for a level
  setLevelTime(i, sec) { LEVELS[i].time = sec; },
  sfxLog: () => S.sfxLog.slice(),
  seed(n) { S.rng = n == null ? Math.random : mulberry(n); },
  // quiet: no sound and no effect animations, for fast headless simulation
  quiet(on) { AU.silent = !!on; S.noFx = !!on; if (on) MUS.stop(); },
  manualClock(on) { S.manualClock = !!on; S.lastT = null; },
  start(i, opts = {}) { startLevel(i, true, opts.instant !== false); return this.state(); },
  advance(sec) { let left = sec; while (left > 1e-9 && S.running && !S.paused) { const dt = Math.min(0.05, left); tickTime(dt); left -= dt; } return S.timeLeft; },
  rotate(id, d) { const o = S.objs.find(x => x.id === id); if (!o || !S.running || S.paused) return false; rotateObj(o, d); return true; },
  setAngle(id, a) { const o = S.objs.find(x => x.id === id); return o ? this.rotate(id, norm(a - o.angle)) : false; },
  release() { if (S.running) evaluate(); },
  select(id) { select(S.objs.find(x => x.id === id) || null); },
  nudge: d => nudge(d),
  done() { doneBtn.click(); },
  pause: () => pause(),
  resume: () => resume(),
  home: () => goHome(),
  resetProgress() { store.data.best = {}; store.save(); S.session = {}; S.fails = {}; },
  computeScore: (objs, timeLeft, win, diffKey) => computeScore(objs.map(o => Object.assign({ target: 0 }, o)), timeLeft, win, diffKey ? DIFFS.find(d => d.key === diffKey) : DF()),
  state() {
    const [n, m] = counts();
    return { screen: gameEl.hidden ? 'home' : 'game', level: S.levelIdx, key: S.L && S.L.key, diff: DF().key, tol: DF().tol,
      running: S.running, paused: S.paused, ended: S.ended, timeLeft: S.timeLeft, timeTotal: S.timeTotal,
      tense: S.tense, peak: gameEl.classList.contains('peak'), aligned: n, required: m,
      doneEnabled: !doneBtn.disabled, timerText: timerEl.textContent,
      objs: S.objs.map(o => ({ id: o.id, angle: o.angle, target: o.target, err: errOf(o), keep: o.keep ?? null, trap: !!o.trap, call: o.call || null, live: o.live,
        aligned: !!o.wasAligned, perfect: !!o.wasPerfect, bonusGiven: !!o.bonusGiven })),
      fails: Object.assign({}, S.fails), session: Object.assign({}, S.session), lastResult: S.lastResult,
      lang: LANG, audio: { music: AU.musicOn, sound: AU.soundOn }, overlays: { intro: !$('#ovIntro').hidden, pause: !$('#ovPause').hidden, result: !$('#ovResult').hidden, chapter: !$('#ovChapter').hidden } };
  }
};

function loop(t) {
  const dt = S.lastT == null ? 0 : Math.min(0.1, (t - S.lastT) / 1000); S.lastT = t;
  if (S.running && !S.paused && !S.manualClock) tickTime(dt);
  if (S.L && S.L.animated && !gameEl.hidden && !document.hidden) S.dirty = true;
  if (S.dirty) { S.dirty = false; render(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
